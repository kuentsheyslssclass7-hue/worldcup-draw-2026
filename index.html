<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>World Cup Draw Test</title>
</head>
<body>

<h1>Firebase Connected ✅</h1>

<div id="status">Loading...</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyC-eLwyVInUcFLS2P_Tf3dcEXfBFd76szU",
  authDomain: "worldcup-draw-2026.firebaseapp.com",
  projectId: "worldcup-draw-2026",
  storageBucket: "worldcup-draw-2026.firebasestorage.app",
  messagingSenderId: "288717227669",
  appId: "1:288717227669:web:5f3d99c26f01b243b2fd9c",
  measurementId: "G-P10B445BBV"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const docRef = doc(db, "draw", "state");

try{
    const snap = await getDoc(docRef);

    if(snap.exists()){
        document.getElementById("status").innerHTML =
        "Firestore Connected Successfully 🚀";
    }else{
        document.getElementById("status").innerHTML =
        "Document not found";
    }

}catch(err){
    document.getElementById("status").innerHTML =
    "Firebase Error: " + err.message;
}

</script>

</body>
</html>
