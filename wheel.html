<!DOCTYPE html>
<html>
<head>
<title>World Cup Wheel Test</title>
<style>
body{
font-family:Arial;
text-align:center;
padding:30px;
background:#f4f4f4;
}
button{
padding:12px 20px;
font-size:18px;
cursor:pointer;
}
#result{
font-size:30px;
font-weight:bold;
margin-top:20px;
}
</style>
</head>
<body>

<h1>2026 FIFA World Cup Draw</h1>

<button onclick="spin()">SPIN</button>

<div id="result">Press SPIN</div>

<script>
const teams=[
"Argentina","Brazil","France","Germany",
"England","Spain","Portugal","USA"
];

function spin(){
let count=0;

const anim=setInterval(()=>{
document.getElementById("result").innerHTML=
teams[Math.floor(Math.random()*teams.length)];

count++;

if(count>20){
clearInterval(anim);

const winner=
teams[Math.floor(Math.random()*teams.length)];

document.getElementById("result").innerHTML=
"⚽ "+winner;
}
},100);
}
</script>

</body>
</html>
