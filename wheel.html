<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026 FIFA World Cup Draw</title>

<style>
body{
font-family:Arial,sans-serif;
background:#f4f4f4;
text-align:center;
padding:20px;
}

.container{
max-width:800px;
margin:auto;
}

input{
padding:12px;
font-size:16px;
width:250px;
margin:10px;
}

button{
padding:12px 20px;
font-size:18px;
cursor:pointer;
margin:5px;
}

#wheel{
width:320px;
height:320px;
border:8px solid #222;
border-radius:50%;
margin:20px auto;
display:flex;
align-items:center;
justify-content:center;
background:white;
font-size:28px;
font-weight:bold;
}

#result{
font-size:32px;
font-weight:bold;
margin-top:15px;
}

table{
width:100%;
background:white;
border-collapse:collapse;
margin-top:20px;
}

th,td{
border:1px solid #ddd;
padding:10px;
}

.remaining{
font-size:20px;
font-weight:bold;
margin-top:15px;
}
</style>
</head>

<body>

<div class="container">

<h1>2026 FIFA World Cup Draw</h1>

<input id="playerName" placeholder="Enter Name">

<br>

<button onclick="spin()">SPIN</button>
<button onclick="resetDraw()">RESET</button>

<div id="wheel">
⚽
</div>

<div id="result">
Press SPIN
</div>

<div class="remaining">
Remaining Teams: <span id="remaining"></span>
</div>

<h2>Assigned Teams</h2>

<table>
<thead>
<tr>
<th>Player</th>
<th>Country</th>
</tr>
</thead>
<tbody id="leaderboard">
</tbody>
</table>

</div>

<script>

const teams=[
"Algeria","Argentina","Australia","Austria","Belgium",
"Bosnia and Herzegovina","Brazil","Canada","Cape Verde",
"Colombia","Croatia","Curaçao","Czechia","DR Congo",
"Ecuador","Egypt","England","France","Germany","Ghana",
"Haiti","Iran","Iraq","Ivory Coast","Japan","Jordan",
"Mexico","Morocco","Netherlands","New Zealand","Norway",
"Panama","Paraguay","Portugal","Qatar","Saudi Arabia",
"Scotland","Senegal","South Africa","South Korea",
"Spain","Sweden","Switzerland","Tunisia","Türkiye",
"Uruguay","USA","Uzbekistan"
];

let remaining=[...teams];

function updateRemaining(){
document.getElementById("remaining").innerHTML=
remaining.length;
}

function spin(){

const player=
document.getElementById("playerName").value.trim();

if(player===""){
alert("Enter your name");
return;
}

if(remaining.length===0){
alert("No countries remaining");
return;
}

let count=0;

const anim=setInterval(()=>{

document.getElementById("wheel").innerHTML=
remaining[Math.floor(Math.random()*remaining.length)];

count++;

if(count>25){

clearInterval(anim);

const index=
Math.floor(Math.random()*remaining.length);

const country=remaining[index];

remaining.splice(index,1);

document.getElementById("wheel").innerHTML=
country;

document.getElementById("result").innerHTML=
"⚽ "+country;

const row=
`<tr><td>${player}</td><td>${country}</td></tr>`;

document.getElementById("leaderboard").innerHTML+=row;

updateRemaining();

}

},100);

}

function resetDraw(){

const player=
document.getElementById("playerName").value.trim();

if(player!=="Kuentshey"){
alert("Only Kuentshey can reset");
return;
}

location.reload();

}

updateRemaining();

</script>

</body>
</html>
